spring:
  application:
    name: driftwatch-backend

  datasource:
    # Override with SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD.
    # No password is stored here; local development uses Testcontainers
    # (see backend/README.md), and deployments must set it explicitly.
    url: jdbc:postgresql://localhost:5432/driftwatch
    username: driftwatch

  jpa:
    hibernate:
      # Flyway owns the schema. Hibernate only checks that entities match it
      # and refuses to start otherwise; it never creates or alters tables.
      ddl-auto: validate
    # No lazy loading during view rendering: transactions end in the service layer.
    open-in-view: false

  jackson:
    deserialization:
      # Reject unknown JSON fields: a typo such as "tasktype" must be an error,
      # not a silently ignored field.
      fail-on-unknown-properties: true

  flyway:
    locations: classpath:db/migration
    # A migration edited after it was applied fails validation at startup.
    validate-on-migrate: true

driftwatch:
  datasets:
    # Where uploaded files are stored (content-addressed by SHA-256). Set
    # DRIFTWATCH_DATASETS_STORAGE_ROOT in deployments; the default is relative
    # to the working directory and meant for local development.
    storage-root: storage/datasets
    # Matches the analytics engine's per-file limit (DRIFTWATCH_MAX_UPLOAD_BYTES).
    max-upload-size: 100MB

management:
  endpoints:
    web:
      exposure:
        # Only what operators and orchestrators need. Other Actuator endpoints
        # (env, beans, configprops, ...) can leak configuration and stay off.
        include: health, info
  endpoint:
    health:
      # Component details (e.g. database host) are not shown to anonymous callers.
      show-details: never
      # /actuator/health/liveness and /readiness for container orchestrators.
      probes:
        enabled: true
      group:
        readiness:
          # Not ready to serve traffic without the database. Liveness does NOT
          # include the database: an outage should not trigger restarts.
          include: readinessState, db
  info:
    # Do not publish the server's Java/OS details; build info is enough.
    java:
      enabled: false
    os:
      enabled: false
