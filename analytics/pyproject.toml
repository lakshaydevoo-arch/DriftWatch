[build-system]
# 77+ understands the SPDX `license` string (PEP 639).
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "driftwatch-analytics"
version = "0.1.0.dev0"
description = "Stateless statistical engine for DriftWatch drift and performance monitoring"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
# Only dependencies that the code actually imports are listed.
dependencies = [
    "fastapi~=0.165",
    "uvicorn~=0.54",
    "python-multipart~=0.0.34",
    "pydantic~=2.14",
    "numpy~=2.5",
    "pandas~=3.1",
    "scipy~=1.18",
    # Performance metrics (design section 6).
    "scikit-learn~=1.9",
]

[project.optional-dependencies]
dev = [
    "pytest~=9.2",
    "httpx2~=2.16",  # Starlette TestClient transport
    "ruff~=0.17.6",
    "mypy~=2.4",
    "pandas-stubs~=3.1.0",
    "scipy-stubs~=1.18.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
xfail_strict = true
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # isort
    "B",       # bugbear
    "UP",      # pyupgrade
    "N",       # naming
    "SIM",     # simplify
    "RUF",     # ruff-specific
]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests", "scripts"]

[[tool.mypy.overrides]]
# scikit-learn ships no type information; it is only used in tests, through
# a typed helper that checks what it returns.
module = ["sklearn.*"]
ignore_missing_imports = true
